<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドコドコカブトムシ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Hiragino Sans", "Meiryo", "Yu Gothic", sans-serif;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 58px;
      background: linear-gradient(135deg, #1a3d12 0%, #2a5c1e 60%, #3d7a2e 100%);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }

    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffc93c;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffc93c;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .header-title p {
      font-size: 0.65rem;
      color: #c8e6a0;
    }

    #map {
      position: absolute;
      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>

  <header>
    <img class="header-icon" src="./kabuto.png" alt="カブトムシ">
    <div class="header-title">
      <h1>ドコドコカブトムシ</h1>
      <p>カブトムシ・クワガタ採集スポットマップ</p>
    </div>
  </header>

  <div id="map"></div>

  <script>
    function initMap() {
      new google.maps.Map(document.getElementById("map"), {
        center: { lat: 35.660, lng: 139.500 },
        zoom: 10,
      });
    }
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD2-K8Q2M4PfErx_YRlfELkiOsQ31oWw1M&callback=initMap"
    async
    defer
  ></script>

</body>
</html>
