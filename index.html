<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドコドコカブトムシ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Hiragino Sans", "Meiryo", "Yu Gothic", sans-serif;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 58px;
      background: linear-gradient(135deg, #1a3d12 0%, #2a5c1e 60%, #3d7a2e 100%);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }

    .header-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffc93c;
      flex-shrink: 0;
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffc93c;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .header-title p {
      font-size: 0.65rem;
      color: #c8e6a0;
    }

    #map {
      position: absolute;
      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>

  <header>
    <img class="header-icon" src="./kabuto.png" alt="カブトムシ">
    <div class="header-title">
      <h1>ドコドコカブトムシ</h1>
      <p>カブトムシ・クワガタ採集スポットマップ</p>
    </div>
  </header>

  <div id="map"></div>

  <script>
    const SPOTS_API_URL = "https://yolp-api-344368516237.asia-northeast1.run.app/";

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildInfoContent(spot) {
      var html = '<div style="max-width:260px;font-size:13px;line-height:1.6">';
      html += '<div style="font-weight:bold;font-size:15px;margin-bottom:6px">' + esc(spot.spot_name) + '</div>';
      if (spot.confirmed_date) {
        html += '<div style="color:#888;font-size:11px;margin-bottom:6px">確認日: ' + esc(spot.confirmed_date) + '</div>';
      }
      if (spot.collection_summary) {
        html += '<div style="margin-bottom:8px">' + esc(spot.collection_summary) + '</div>';
      }
      if (spot.tree_type) {
        html += '<div style="margin-bottom:4px">🌳 ' + esc(spot.tree_type) + '</div>';
      }
      if (spot.target_species) {
        html += '<div style="margin-bottom:4px">🪲 ' + esc(spot.target_species) + '</div>';
      }
      if (spot.reference_url) {
        html += '<div style="margin-top:8px"><a href="' + esc(spot.reference_url) + '" target="_blank" rel="noopener noreferrer">🌐 参考サイト</a></div>';
      }
      html += '</div>';
      return html;
    }

    function initMap() {
      var map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 35.660, lng: 139.500 },
        zoom: 10,
      });

      var openInfoWindow = null;

      fetch(SPOTS_API_URL)
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(spots) {
          spots.forEach(function(spot) {
            var marker = new google.maps.Marker({
              position: { lat: spot.latitude, lng: spot.longitude },
              map: map,
              title: spot.spot_name,
            });

            var infoWindow = new google.maps.InfoWindow({
              content: buildInfoContent(spot),
            });

            marker.addListener("click", function() {
              if (openInfoWindow) openInfoWindow.close();
              infoWindow.open({ anchor: marker, map: map });
              openInfoWindow = infoWindow;
            });
          });
        })
        .catch(function(err) {
          console.error("スポットデータ取得失敗:", err.message);
        });
    }
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD2-K8Q2M4PfErx_YRlfELkiOsQ31oWw1M&callback=initMap"
    async
    defer
  ></script>

</body>
</html>
